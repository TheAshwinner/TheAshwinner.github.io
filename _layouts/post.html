---
layout: default
---
<article class="post h-entry" itemscope itemtype="http://schema.org/BlogPosting">
  <p class="post__back"><a href="{{ '/writing/' | relative_url }}">&larr; writing</a></p>

  <header class="post__header">
    <h1 class="post__title p-name" itemprop="name headline">{{ page.title | escape }}</h1>
    <p class="post__meta">
      <time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">
        {{ page.date | date: "%B %-d, %Y" }}
      </time>
      {%- if page.author %}
      &middot; <span itemprop="author" itemscope itemtype="http://schema.org/Person"><span class="p-author h-card" itemprop="name">{{ page.author }}</span></span>
      {%- endif %}
      {%- if page.last_modified_at %}
      <br>
      <span class="post__updated">Last updated
        <time datetime="{{ page.last_modified_at | date_to_xmlschema }}" itemprop="dateModified">{{ page.last_modified_at | date: "%B %-d, %Y" }}</time>
      </span>
      {%- endif %}
    </p>
  </header>

  <div class="post__content e-content prose" itemprop="articleBody">
    {{ content }}
  </div>

  <a class="u-url" href="{{ page.url | relative_url }}" hidden></a>
</article>

<script>
  // Clickable anchors on post headings. kramdown already gives every heading
  // an id -- that's what the table of contents links to -- so this only adds
  // the visible handle that lets a reader grab a section link without digging
  // through the page source.
  (function () {
    var content = document.querySelector('.prose');
    if (!content) return;

    var headings = content.querySelectorAll('h2[id], h3[id], h4[id], h5[id], h6[id]');

    Array.prototype.forEach.call(headings, function (heading) {
      var link = document.createElement('a');
      link.className = 'heading-anchor';
      link.href = '#' + heading.id;
      link.textContent = '#';
      // The '#' is decoration; give assistive tech something meaningful.
      link.setAttribute('aria-label', 'Link to section: ' + heading.textContent.trim());
      heading.appendChild(link);
    });
  })();
</script>

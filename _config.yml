# Site settings
title: Ashwin Sreevatsa
tagline: AI safety researcher
description: >-
  Ashwin Sreevatsa — AI safety and alignment research.
url: "https://theashwinner.github.io"
baseurl: ""

# The visible label is `email_label`; the real address is used only in the
# mailto: href, so it never appears as scrapeable page text.
email_label: email
email_address: public.ashwinsreevatsa@gmail.com

# Homepage
headshot: /assets/images/headshot.webp
# Flip to true when you have news worth showing. The section, its nav link,
# and _data/news.yml all stay in place while this is false.
show_news: false
# news_limit: 8   # uncomment to cap how many news items the homepage shows

# Posts live under /writing/
permalink: /writing/:title/

# Markdown. `toc_levels` caps how deep a `{:toc}` table of contents goes;
# posts without a `{:toc}` marker are unaffected.
kramdown:
  toc_levels: 2..3

# Build settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

feed:
  path: /feed.xml

# Setting `exclude` replaces Jekyll's defaults, so the defaults are repeated here.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - package.json
  - package-lock.json
  - README.md
